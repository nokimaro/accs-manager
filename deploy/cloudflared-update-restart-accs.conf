# Installed as /etc/systemd/system/cloudflared-update.service.d/restart-accs.conf.
# The packaged updater restarts only cloudflared.service; our tunnel runs the same binary
# from its own unit and would keep executing the old code until restarted by hand.
[Service]
ExecStartPost=/bin/bash -c "systemctl is-active --quiet cloudflared-accs && systemctl restart cloudflared-accs || true"
