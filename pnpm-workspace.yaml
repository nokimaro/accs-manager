packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 fails CI installs on unreviewed build scripts: allow or deny each explicitly
allowBuilds:
  esbuild: true
  msw: false
  # optional native deps of testcontainers (docker-modem → ssh2); not needed
  cpu-features: false
  ssh2: false
  protobufjs: false
  # optional native msgpack speedup of bullmq; the pure-JS fallback is used
  msgpackr-extract: false
  # @mtcute/node's optional sqlite storage; we store sessions in Postgres and it is never loaded
  better-sqlite3: false
