name: ci

# docs-only changes (docs/**, *.md) neither rebuild nor redeploy the app;
# a push that also touches code runs the whole pipeline as usual
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: ci-${{ github.ref }}
  # superseded PR runs are cancelled; main runs queue instead, so a deploy is never cut off midway
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-trixie
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      # vitest.global-setup.ts uses these instead of starting testcontainers
      TEST_PG_URL: postgres://test:test@localhost:5432/test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm i -g pnpm@12.8.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # e2e/ and playwright.config.ts belong to no workspace package
      - run: npx tsc -p e2e/tsconfig.json
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_LOGIN: e2e
      E2E_PASSWORD: e2e-password-123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm i -g pnpm@12.8.2
      - run: pnpm install --frozen-lockfile
      - name: Write .env for compose
        run: |
          {
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "PUBLIC_ORIGIN=$E2E_BASE_URL"
          } > .env
      - run: docker compose up -d --build --wait
      - name: Create e2e admin
        run: printf '%s\n' "$E2E_PASSWORD" | docker compose exec -T accs-api node apps/api/src/cli.ts admin:create --login "$E2E_LOGIN" --password-stdin
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            compose.log

  # main only: publish the image once checks and e2e are green, then roll it out
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/nokimaro/accs-manager:${{ github.sha }}
            ghcr.io/nokimaro/accs-manager:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    # secrets live in the environment, which only main may use
    environment:
      name: production
      url: https://panel.159.team
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - name: Deploy over SSH (the key can only run `deploy <sha>`)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the short-lived job token lets the server pull the image even if the package is private
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "accs-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Wait for panel.159.team to serve the new version
        run: |
          for _ in $(seq 1 36); do
            version=$(curl -fsS --max-time 5 https://panel.159.team/api/healthz | jq -r .version || true)
            if [ "$version" = "$GITHUB_SHA" ]; then echo "live: $version"; exit 0; fi
            sleep 5
          done
          echo "panel.159.team still reports ${version:-nothing}, expected $GITHUB_SHA" >&2
          exit 1
